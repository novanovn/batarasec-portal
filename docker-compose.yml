services:
  nginx:
    image: nginx:1.27-alpine
    container_name: batarasec-portal-nginx
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batarasec-portal-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      PORTAL_URL: ${PORTAL_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-batarasec_portal}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-batarasec_portal}
      VALKEY_URL: redis://valkey:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LICENSE_SIGNING_SECRET: ${LICENSE_SIGNING_SECRET:-change-this-license-secret}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-change-this-settings-key}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-license@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-change-me}
      SMTP_FROM: ${SMTP_FROM:-BataraSec <license@example.com>}
      SMTP_DRY_RUN: ${SMTP_DRY_RUN:-false}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: batarasec-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batarasec_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-batarasec_portal}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: batarasec-portal-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: batarasec-portal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-minio-password}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://portal.batarasec.com/storage}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batarasec-portal-worker
    restart: unless-stopped
    command: ["pnpm", "worker:license-email"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-batarasec_portal}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-batarasec_portal}
      VALKEY_URL: redis://valkey:6379
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-license@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-change-me}
      SMTP_FROM: ${SMTP_FROM:-BataraSec <license@example.com>}
      SMTP_DRY_RUN: ${SMTP_DRY_RUN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  minio_data:
