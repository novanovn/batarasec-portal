# BataraSec Portal — Production Nginx Config
# Target: https://portal.batarasec.com -> portal:4000 (Docker internal)
# TLS is terminated at Cloudflare or at this server with certbot.
# If using Cloudflare full-strict, set ssl_certificate to Cloudflare Origin Cert.

limit_req_zone $binary_remote_addr zone=portal_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=portal_auth:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=minio_api:10m    rate=30r/s;

# Redirect HTTP to HTTPS
server {
  listen 80;
  server_name portal.batarasec.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name portal.batarasec.com;

  # --- TLS ---
  # Option A: Cloudflare Origin Certificate (recommended when behind Cloudflare proxy)
  ssl_certificate     /etc/ssl/portal/cert.pem;
  ssl_certificate_key /etc/ssl/portal/key.pem;

  # Option B: certbot/Let's Encrypt — replace paths above with:
  # ssl_certificate     /etc/letsencrypt/live/portal.batarasec.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/portal.batarasec.com/privkey.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;

  server_tokens     off;
  client_max_body_size 512m;  # increased for MinIO file uploads

  # --- Security headers (portal pages) ---
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    nosniff always;
  add_header X-Frame-Options           DENY always;
  add_header Referrer-Policy           no-referrer always;
  add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

  # =========================================================
  # MinIO S3 API  ->  /s3/
  # Usage: https://portal.batarasec.com/s3/bucket/object
  # =========================================================
  location /s3/ {
    limit_req zone=minio_api burst=60 nodelay;
    limit_req_status 429;

    rewrite ^/s3/(.*) /$1 break;
    proxy_pass         http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;

    # Required for MinIO presigned URLs and multipart uploads
    proxy_buffering    off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # =========================================================
  # MinIO Console (Web UI)  ->  /storage/
  # Usage: https://portal.batarasec.com/storage/
  # =========================================================
  location /storage/ {
    rewrite ^/storage/(.*) /$1 break;
    proxy_pass         http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 300s;
  }

  # =========================================================
  # Portal API — login: tight rate limit
  # =========================================================
  location = /api/auth/login {
    limit_req zone=portal_auth burst=5 nodelay;
    limit_req_status 429;

    proxy_pass         http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  # =========================================================
  # Portal — all other routes
  # =========================================================
  location / {
    limit_req zone=portal_general burst=30 nodelay;
    limit_req_status 429;

    proxy_pass         http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}
