limit_req_zone $binary_remote_addr zone=portal_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=portal_auth:10m rate=5r/m;

server {
  listen 8080;
  server_name _;

  server_tokens off;
  client_max_body_size 2m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /api/auth/login {
    limit_req zone=portal_auth burst=5 nodelay;
    proxy_pass http://portal:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=portal_general burst=30 nodelay;
    proxy_pass http://portal:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
